*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.empty-chips{font-size:11px;color:var(--muted);font-style:italic}
.ix-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px 3px 10px;border-radius:20px;font-family:var(--mono);font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;animation:chipIn .15s ease;position:relative;overflow:hidden}
@keyframes chipIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.chip-remove{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;opacity:.55;color:inherit;transition:opacity .1s;position:relative;z-index:1}
.chip-remove:hover{opacity:1}
.chip-loading{opacity:.85}
.chip-bar{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.55;transition:width .35s ease;border-radius:0 2px 0 0}
.chip-pct{font-size:9px;opacity:.7;font-weight:400;margin-left:1px}
.chip-cached{font-size:9px;opacity:.45;font-weight:400}
.chip-partial{font-size:10px;color:var(--warning);cursor:help}
.search-row{display:flex;gap:8px;align-items:center}
.search-wrap{position:relative}
.ix-search{background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:5px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;width:270px;outline:none;transition:border-color .15s}
.ix-search:focus{border-color:var(--focus)}
.ix-search::placeholder{color:var(--muted)}
.ix-search:disabled{opacity:.4;cursor:not-allowed}
.max-note{font-size:10px;color:var(--muted);font-family:var(--mono)}
.ix-dropdown{position:absolute;top:calc(100% + 4px);left:0;width:420px;background:var(--surface-raised);border:1px solid var(--border);border-radius:7px;z-index:50;max-height:300px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.ix-dropdown:empty,.ix-dropdown[data-empty]{display:none}
.dd-item{padding:9px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border)}
.dd-item:last-child{border-bottom:none}
.dd-item:hover{background:var(--surface-hover)}
.dd-item.is-added{opacity:.35;cursor:default;pointer-events:none}
.dd-item.is-full{opacity:.3;cursor:not-allowed;pointer-events:none}
.dd-name{font-size:12px;color:var(--head);font-weight:500}
.dd-meta{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.dd-count{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.dd-msg{padding:12px 13px;font-size:11px;color:var(--muted);text-align:center;font-family:var(--mono)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── STATS ── */
.stats{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.stats:empty{display:none}
.stat{padding:8px 18px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.stat-n{font-family:var(--mono);font-size:16px;font-weight:600}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}

/* ── TOOLBAR ── */
.toolbar{padding:8px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);flex-shrink:0}

.tasn{font-family:var(--mono);font-size:11px;color:var(--muted)}

.ix-cell{display:flex;align-items:center;gap:5px;white-space:nowrap}

.ccode{font-family:var(--mono);font-size:10px;color:var(--muted)}

      <div class="search-wrap">
        <input class="ix-search" id="ix-search" type="text"
               placeholder="" autocomplete="off">
        <div class="ix-dropdown" id="ix-dropdown" data-empty></div>
      </div>
      <span class="max-note" id="max-note"></span>
    </div>
  </div>
</div>

<!-- STATS -->
<div class="stats" id="stats"></div>

<!-- TOOLBAR -->
<div class="toolbar" id="toolbar" style="display:none">

  </select>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">⇅</div>
    <div class="empty-title" id="empty-title-el"></div>
    <div class="empty-sub" id="empty-sub-el"></div>
  </div>
  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="mhdr">
      <span class="mtitle" id="mtitle">Export ASNs</span>

    </div>
    <div class="mbody">

      <div class="mcode" id="mcode"></div>

        <button class="mbtn mbtn-dl" id="mbtn-dl" data-action="download"></button>
        <button class="mbtn mbtn-copy" id="mbtn-copy" data-action="copy"></button>
      </div>
    </div>
  </div>
</div>
